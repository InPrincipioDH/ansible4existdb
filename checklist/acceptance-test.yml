#      set_fact:
#        webdav_update_valid: >-
#          {{
#            webdav_verify_update_check.content
#            is search('<test>updated</test>')
#          }}
#
#    - include_tasks: tasks/add_result.yml
#      vars:
#        test_name: "WebDAV update file"
#        test_status: "{{ '✅ PASS' if webdav_update_valid else '❌ FAIL' }}"
#        test_details: "{{ webdav_verify_update_check.msg | default('File updated') }}"

    - name: Delete test file via WebDAV
      uri:
        url: "http://localhost:{{ exist_http_port }}/exist/webdav/db/projects/{{ ediarum_project_slug }}/data/{{ webdav_test_file }}"
        method: DELETE
        user: "{{ non_dba_user }}"
        password: "{{ non_dba_pw }}"
        force_basic_auth: true
        status_code:
          - 200
          - 204
      register: webdav_delete_check
      ignore_errors: true

    - include_tasks: tasks/add_result.yml
      vars:
        test_name: "WebDAV delete file"
        test_status: "{{ '✅ PASS' if not webdav_delete_check.failed else '❌ FAIL' }}"
        test_details: "{{ webdav_delete_check.msg | default('File deleted') }}"

    # See https://www.ediarum.org/docs/set-up/DE/topics/customization/id-generator.html
    - name: Request new BSPP ID as oxygen bot
      uri:
        url: "http://localhost:{{ exist_http_port }}/exist/rest/db/projects/bspp/oxygen/ediarum_idGenerator.xql"
        method: GET
        user: "{{ oxygen_bot_user }}"
        password: "{{ oxygen_bot_pw }}"
        force_basic_auth: true
        return_content: true
        status_code: 200
      register: oxbot_id_generator_check
      ignore_errors: true

    - name: Validate generated ID
      set_fact:
        oxbot_id_generator_valid: >-
          {{
            (not oxbot_id_generator_check.failed)
            and
            (
              oxbot_id_generator_check.content
              is search('<new-id>.+</new-id>')
            )
          }}

    - include_tasks: tasks/add_result.yml
      vars:
        test_name: "Oxbot can generate BSPP ID"
        test_status: "{{ '✅ PASS' if oxbot_id_generator_valid else '❌ FAIL' }}"
        test_details: "{{ oxbot_id_generator_check.content | default(oxbot_id_generator_check.msg) }}"

    - name: Run index regeneration scheduler job
      uri:
        url: "http://localhost:{{ exist_http_port }}/exist/rest/db/projects/bspp/exist/routinen/scheduler/regenerate_register.xql"
        method: GET
        user: "{{ exist_admin_user }}"
        password: "{{ exist_admin_pw }}"
        force_basic_auth: true
        return_content: true
        status_code: 200
        timeout: 500
      register: scheduler_run
      ignore_errors: true
      when: not scheduler_check.failed

    - name: Validate generated ID
      set_fact:
        index_regenerated: >-
          {{
            (not scheduler_run.failed)
            and
            (
              scheduler_run.content
              is search('<type>success</type>')
            )
          }}

    - include_tasks: tasks/add_result.yml
      vars:
        test_name: "Scheduler job running"
        test_status: "{{ '✅ PASS' if index_regenerated else '❌ FAIL' }}"
        test_details: "{{ scheduler_run.msg | default('OK') }}"
      when: not scheduler_check.failed

    - include_tasks: tasks/add_result.yml
      vars:
        test_name: Dependent second check
        test_status: "⚪ SKIPPED"
        test_details: "Prerequesite failed (scheduler check)"
      when: scheduler_check.failed

    ############################################################
    # CREATE REPORT
    ############################################################

    - name: Generate report
      delegate_to: localhost
      copy:
        dest: ./acceptance-report.md
        content: |
          # Acceptance Test Report

          | Test | Status | Details |
          |------|--------|---------|
          {% for test in acceptance_results %}
          | {{ test.name }} | {{ test.status }} | {{ test.details | regex_replace('\r?\n','<br>') }} |
          {% endfor %}

    ############################################################
    # FINAL VERDICT
    ############################################################

    - name: Collect failures
      set_fact:
        failed_tests: >-
          {{
            acceptance_results
            | selectattr('status', 'search', 'FAIL')
            | list
          }}

    - name: Show report location
      debug:
        msg: "Acceptance report written to acceptance-report.md"

    - name: Fail if any acceptance test failed
      fail:
        msg: "{{ failed_tests | length }} acceptance test(s) failed."
      when: failed_tests | length > 0