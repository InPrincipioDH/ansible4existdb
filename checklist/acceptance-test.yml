---
- name: Acceptance Tests
  hosts: exist_servers
  gather_facts: false
  vars_files:
    - ../vars.yml
    - ../vault.yml
  vars:
    acceptance_results: []

  tasks:

    #####################
    # TEST STAGE
    ####################

    ###
    # Reachability Tests
    ###

    - name: Exist reachable
      uri:
        url: "http://localhost:{{ exist_http_port }}"
        status_code: 200
      register: exist_locally_reachable_check
      ignore_errors: true

    - include_tasks: tasks/add_result.yml
      vars:
        test_name: Exist reachable
        test_status: "{{ '✅ PASS' if not exist_locally_reachable_check.failed else '❌ FAIL' }}"
        test_details: "{{ exist_locally_reachable_check.msg | default('OK') }}"

    # Since it is recommended to open exist-db locations on a need to know basis, we gracefully accept both HTTP 200 and 403. Adapt to your setup, if needed
    - name: Host reachable via proxy remotely
      uri:
        url: "http://{{ inventory_hostname }}/exist"
        status_code: 200, 403
      delegate_to: localhost
      register: proxy_reachable_check
      ignore_errors: true

    - include_tasks: tasks/add_result.yml
      vars:
        test_name: Host reachable via proxy remotely
        test_status: "{{ '✅ PASS' if not proxy_reachable_check.failed else '❌ FAIL' }}"
        test_details: "{{ proxy_reachable_check.msg | default('OK') }}"

    # Since it is recommended to open exist-db locations on a need to know basis, we gracefully accept both HTTP 200 and 403. Adapt to your setup, if needed
    - name: Host reachable via https remotely
      tags:
        - optional
      uri:
        url: "https://{{ inventory_hostname }}/exist"
        status_code: 200, 403
      delegate_to: localhost
      register: https_reachable_check
      ignore_errors: true

    - include_tasks: tasks/add_result.yml
      tags:
        - optional
      vars:
        test_name: Host reachable via https remotely
        test_status: "{{ '✅ PASS' if not https_reachable_check.failed else '❌ FAIL' }}"
        test_details: "{{ https_reachable_check.msg | default('OK') }}"

    ###
    # User Tests
    ###

    # Bot access is necessary for connection between Oxygen XML editor and some ediarum.db functionalities
    - name: Login with oxygen bot user
      uri:
        url: "http://localhost:{{ exist_http_port }}/exist/rest/db"
        method: GET
        user: "{{ oxygen_bot_user }}"
        password: "{{ oxygen_bot_pw }}"
        force_basic_auth: true
        status_code: 200
      register: oxygen_bot_login_check
      ignore_errors: true

    - include_tasks: tasks/add_result.yml
      vars:
        test_name: "Login with oxygen bot user"
        test_status: "{{ '✅ PASS' if not oxygen_bot_login_check.failed else '❌ FAIL' }}"
        test_details: "{{ oxygen_bot_login_check.msg | default('Authentication successful') }}"

    # Individual project member access is necessary for connection between Oxygen XML editor and database
    - name: Login with non-DBA user
      uri:
        url: "http://localhost:{{ exist_http_port }}/exist/rest/db"
        method: GET
        user: "{{ non_dba_user }}"
        password: "{{ non_dba_pw }}"
        force_basic_auth: true
        status_code: 200
      register: non_dba_login_check
      ignore_errors: true

    - include_tasks: tasks/add_result.yml
      vars:
        test_name: "Login with non-DBA user"
        test_status: "{{ '✅ PASS' if not non_dba_login_check.failed else '❌ FAIL' }}"
        test_details: "{{ non_dba_login_check.msg | default('Authentication successful') }}"

    - name: Reject invalid credentials
      uri:
        url: "http://localhost:{{ exist_http_port }}/exist/rest/db"
        method: GET
        user: "{{ oxygen_bot_user }}"
        password: "wrong_password"
        force_basic_auth: true
        status_code: 401
      register: invalid_login_check
      ignore_errors: true

    - include_tasks: tasks/add_result.yml
      vars:
        test_name: "Invalid credentials rejected"
        test_status: "{{ '✅ PASS' if not invalid_login_check.failed else '❌ FAIL' }}"
        test_details: "{{ invalid_login_check.msg | default('Authentication rejected as expected') }}"

    ###
    # Basic Ediarum Project Setup Tests
    ###

    # Basic Webdav access - if this is available, connecting oxygen xml editor should not be a problem
    # See https://www.ediarum.org/docs/set-up/DE/topics/setup/oxygen_mit-db-verbinden.html
    - name: Project access with non-DBA user
      uri:
        url: "http://localhost:{{ exist_http_port }}/exist/webdav/db/projects/{{ ediarum_project_slug}}/data"
        method: GET
        user: "{{ non_dba_user }}"
        password: "{{ non_dba_pw }}"
        force_basic_auth: true
        status_code: 200
      register: project_access
      ignore_errors: true

    - include_tasks: tasks/add_result.yml
      vars:
        test_name: "Project access with non-DBA user"
        test_status: "{{ '✅ PASS' if not project_access.failed else '❌ FAIL' }}"
        test_details: "{{ project_access.msg | default('Project access successful') }}"

    # See ediarum.db package web UI, Verwaltung / Scheduler and Projektkonfiguration / Scheduler
    # These tests check if there is an ediarum scheduler job configured - unsure about the value of this test.
    - name: Query scheduler jobs
      uri:
        url: "http://localhost:{{ exist_http_port }}/exist/rest/db"
        method: POST
        body_format: raw
        headers:
          Content-Type: application/xml
        body: |
          <query xmlns="http://exist.sourceforge.net/NS/exist">
            <text>
              xquery version "3.1";
    
              import module namespace scheduler="http://exist-db.org/xquery/scheduler";
    
              scheduler:get-scheduled-jobs()
            </text>
          </query>
        return_content: true
        status_code: 200
      register: scheduler_check
      ignore_errors: true

    - name: Show scheduler response
      debug:
        var: scheduler_check.content

    - name: Check for ediarum scheduler
      set_fact:
        ediarum_scheduler_present: >-
          {{
          scheduler_check.content is search('name="ediarumScheduler')
          }}

    - include_tasks: tasks/add_result.yml
      vars:
        test_name: "Ediarum scheduler registered"
        test_status: "{{ '✅ PASS' if ediarum_scheduler_present else '❌ FAIL' }}"
        test_details: >-
          {{
            'Found ediarum scheduler job'
            if ediarum_scheduler_present
            else 'No ediarum scheduler job found'
          }}

    ###
    # Ediarum Project Setup: Specific Files
    ###

    - name: Person index
      uri:
        url: "http://localhost:{{ exist_http_port }}/exist/rest/db/projects/bspp/oxygen/ediarum.xql?index=persons"
        method: GET
        user: "{{ oxygen_bot_user }}"
        password: "{{ oxygen_bot_pw }}"
        force_basic_auth: true
        status_code: 200
      register: oxygen_register_persons
      ignore_errors: true

    - include_tasks: tasks/add_result.yml
      vars:
        test_name: "Person index access"
        test_status: "{{ '✅ PASS' if not oxygen_register_persons.failed else '❌ FAIL' }}"
        test_details: "{{ oxygen_register_persons.msg | default('Index retrieval successful') }}"

    - name: Place index
      uri:
        url: "http://localhost:{{ exist_http_port }}/exist/rest/db/projects/bspp/oxygen/ediarum.xql?index=places"
        method: GET
        user: "{{ oxygen_bot_user }}"
        password: "{{ oxygen_bot_pw }}"
        force_basic_auth: true
        status_code: 200
      register: oxygen_register_places
      ignore_errors: true

    - include_tasks: tasks/add_result.yml
      vars:
        test_name: "Place index access"
        test_status: "{{ '✅ PASS' if not oxygen_register_places.failed else '❌ FAIL' }}"
        test_details: "{{ oxygen_register_places.msg | default('Index retrieval successful') }}"

    - name: Org index
      uri:
        url: "http://localhost:{{ exist_http_port }}/exist/rest/db/projects/bspp/oxygen/ediarum.xql?index=organisations"
        method: GET
        user: "{{ oxygen_bot_user }}"
        password: "{{ oxygen_bot_pw }}"
        force_basic_auth: true
        status_code: 200
      register: oxygen_register_orgs
      ignore_errors: true

    - include_tasks: tasks/add_result.yml
      vars:
        test_name: "Org index access"
        test_status: "{{ '✅ PASS' if not oxygen_register_orgs.failed else '❌ FAIL' }}"
        test_details: "{{ oxygen_register_orgs.msg | default('Index retrieval successful') }}"

    - name: Edition index (Zotero)
      uri:
        url: "http://localhost:{{ exist_http_port }}/exist/rest/db/projects/bspp/oxygen/ediarum.xql?index=editionen"
        method: GET
        user: "{{ oxygen_bot_user }}"
        password: "{{ oxygen_bot_pw }}"
        force_basic_auth: true
        status_code: 200
      register: oxygen_register_editions
      ignore_errors: true

    - include_tasks: tasks/add_result.yml
      vars:
        test_name: "Edition index access"
        test_status: "{{ '✅ PASS' if not oxygen_register_editions.failed else '❌ FAIL' }}"
        test_details: "{{ oxygen_register_editions.msg | default('Index retrieval successful') }}"

    ###
    # Ediarum Project Operations
    ###

    - name: Generate WebDAV test UUID
      set_fact:
        webdav_test_id: "{{ lookup('password', '/dev/null length=32 chars=hexdigits') }}"
    - name: Define WebDAV test filename
      set_fact:
        webdav_test_file: "automated_test_{{ webdav_test_id }}.xml"

    - name: Create test file via WebDAV
      uri:
        url: "http://localhost:{{ exist_http_port }}/exist/webdav/db/projects/{{ ediarum_project_slug }}/data/{{ webdav_test_file }}"
        method: PUT
        user: "{{ non_dba_user }}"
        password: "{{ non_dba_pw }}"
        force_basic_auth: true
        body: |
          <test>created</test>
        body_format: raw
        headers:
          Content-Type: application/xml
        status_code:
          - 200
          - 201
          - 204
      register: webdav_create_check
      ignore_errors: true

    - include_tasks: tasks/add_result.yml
      vars:
        test_name: "WebDAV create file"
        test_status: "{{ '✅ PASS' if not webdav_create_check.failed else '❌ FAIL' }}"
        test_details: >-
          File: {{ webdav_test_file }}

    - name: Update test file via WebDAV
      uri:
        url: "http://localhost:{{ exist_http_port }}/exist/webdav/db/projects/{{ ediarum_project_slug }}/data/{{ webdav_test_file }}"
        method: PUT
        user: "{{ non_dba_user }}"
        password: "{{ non_dba_pw }}"
        force_basic_auth: true
        body: |
          <test>updated</test>
        body_format: raw
        headers:
          Content-Type: application/xml
        status_code:
          - 200
          - 201
          - 204
      register: webdav_update_check
      ignore_errors: true

    - include_tasks: tasks/add_result.yml
      vars:
        test_name: "WebDAV update file"
        test_status: "{{ '✅ PASS' if not webdav_update_check.failed else '❌ FAIL' }}"
        test_details: "{{ webdav_update_check.msg | default('File updated') }}"
#### Checking result of PUT is skipped because the url module will be confused by the fact that exist webdav payload provides a "size" info of 4096 regardless of the real file content size
#    - name: Verify updated contents
#      uri:
#        url: "http://localhost:{{ exist_http_port }}/exist/webdav/db/projects/{{ ediarum_project_slug }}/data/{{ webdav_test_file }}"
#        method: GET
#        user: "{{ non_dba_user }}"
#        password: "{{ non_dba_pw }}"
#        force_basic_auth: true
#        return_content: true
#        status_code: 200
#      register: webdav_verify_update_check
#      ignore_errors: true
#
